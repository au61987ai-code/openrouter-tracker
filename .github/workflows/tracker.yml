name: OpenRouter 24/7 Price Tracker & Discord Alert

on:
  schedule:
    # Runs every 30 minutes (Cron UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Run OpenRouter Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ONLY_HIKES: ${{ vars.ONLY_HIKES }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node tracker.js

      - name: 💾 Commit & Push Updated Snapshots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add snapshot.json change_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update price snapshot and change logs [skip ci]" && git push)
